protocol: pendle
name: Pendle (router, PT / YT / SY, markets)
chain_id: 1
status: draft
reviewed: false
adding: >
  All user actions go through the PendleRouterV4. A market is `market_<asset>_<expiry>`
  with factory() = a market factory as proof; its PT / YT / SY are keyed by symbol()
  (sanitized, symbol in `aliases`) and prove each other (SY(), YT(), PT(), factory()).
  The SY's yieldToken() is its underlying edge. Markets expire: keep expired ones only
  while a vault still holds PT, YT or LP.

