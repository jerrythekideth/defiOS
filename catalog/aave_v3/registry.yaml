contracts:
  provider_registry:
    address: "0xbaA999AC55EAce41CcAE355c77809e68Bb345170"
    category: config
    kind: addresses_provider_registry
    note: "Lists the PoolAddressesProvider of the Aave v3 markets on Ethereum"
    sources:
      - "address-book: https://github.com/bgd-labs/aave-address-book/blob/main/src/AaveV3Ethereum.sol"
    proofs:
      - { read: "getAddressesProvidersList() returns (address[])", expect: { contains: addresses_provider } }
  prime_provider_registry:
    address: "0xC6cAB8D39D93DC0Bd5986E7Ce5Bb956E30103A43"
    category: config
    kind: addresses_provider_registry
    sources:
      - "address-book: https://github.com/bgd-labs/aave-address-book/blob/main/src/AaveV3EthereumLido.sol"
    proofs:
      - { read: "getAddressesProvidersList() returns (address[])", expect: { contains: prime_addresses_provider } }
  pool_configurator:
    address: "0x64b761D848206f447Fe2dd461b0c635Ec39EbB27"
    category: config
    kind: pool_configurator
    sources:
      - "address-book: https://github.com/bgd-labs/aave-address-book/blob/main/src/AaveV3Ethereum.sol"
    proofs:
      - { from: addresses_provider, read: "getPoolConfigurator() returns (address)", expect: $self }
  oracle:
    address: "0x54586bE62E3c3580375aE3723C145253060Ca0C2"
    category: oracle
    kind: aave_oracle
    sources:
      - "address-book: https://github.com/bgd-labs/aave-address-book/blob/main/src/AaveV3Ethereum.sol"
    proofs:
      - { from: addresses_provider, read: "getPriceOracle() returns (address)", expect: $self }
  acl_manager:
    address: "0xc2aaCf6553D20d1e9d78E365AAba8032af9c85b0"
    category: config
    kind: acl_manager
    sources:
      - "address-book: https://github.com/bgd-labs/aave-address-book/blob/main/src/AaveV3Ethereum.sol"
    edges: { admin: aave.executor_lvl1 }
    proofs:
      - { from: addresses_provider, read: "getACLManager() returns (address)", expect: $self }
  data_provider:
    address: "0x0a16f2FCC0D44FaE41cc54e079281D84A363bECD"
    category: config
    kind: pool_data_provider
    sources:
      - "address-book: https://github.com/bgd-labs/aave-address-book/blob/main/src/AaveV3Ethereum.sol"
    proofs:
      - { from: addresses_provider, read: "getPoolDataProvider() returns (address)", expect: $self }
  weth_gateway:
    address: "0xd01607c3C5eCABa394D8be377a08590149325722"
    category: adapter
    kind: weth_gateway
    aliases: ["aave core weth gateway"]
    note: "Wraps ETH and supplies / repays / withdraws WETH on the pool"
    sources:
      - "address-book: https://github.com/bgd-labs/aave-address-book/blob/main/src/AaveV3Ethereum.sol"
    edges: { underlying: weth.WETH }
    proofs:
      - { read: "POOL() returns (address)", expect: pool }
  aEthWETH:
    address: "0x4d5F47FA6A74757f35C14fD3a6Ef8E3C9BC514E8"
    name: "Aave Ethereum WETH"
    category: receipt
