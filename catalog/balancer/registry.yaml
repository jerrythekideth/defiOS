contracts:
  BAL:
    address: "0xba100000625a3754423978a60c9317c58a424e3D"
    name: "Balancer"
    category: governance
    kind: erc20
    decimals: 18
    aliases: ["bal", "balancer"]
    sources:
      - "docs: https://docs.balancer.fi/developer-reference/contracts/deployment-addresses/mainnet.html"
    proofs:
      - { from: minter, read: "getBalancerToken() returns (address)", expect: $self }
  minter:
    address: "0x239e55F427D44C3cc793f49bFB507ebe76638a2b"
    category: minter
    kind: balancer_minter
    aliases: ["balancer minter", "bal minter"]
    note: "mint(gauge) claims BAL emissions for a gauge deposit"
    sources:
      - "docs: https://docs.balancer.fi/developer-reference/contracts/deployment-addresses/mainnet.html"
      - "address-book: https://github.com/balancer/balancer-deployments/blob/master/addresses/mainnet.json"
    proofs:
      - { read: "getBalancerToken() returns (address)", expect: BAL }
      - { read: "getGaugeController() returns (address)", expect: gauge_controller }
  gauge_controller:
    address: "0xC128468b7Ce63eA702C1f104D55A2566b13D3ABD"
    category: config
    kind: balancer_gauge_controller
    aliases: ["balancer gauge controller"]
    sources:
      - "docs: https://docs.balancer.fi/developer-reference/contracts/deployment-addresses/mainnet.html"
      - "address-book: https://github.com/balancer/balancer-deployments/blob/master/addresses/mainnet.json"
    proofs:
      - { from: minter, read: "getGaugeController() returns (address)", expect: $self }
      - { read: "voting_escrow() returns (address)", expect: veBAL }
  B_80BAL_20WETH:
    address: "0x5c6Ee304399DBdB9C8Ef030aB642B10820DB8F56"
    name: "Balancer 80 BAL 20 WETH"
    category: receipt
    kind: balancer_v2_bpt
    decimals: 18
    aliases: ["B-80BAL-20WETH", "80bal-20weth", "balancer 80 bal 20 weth"]
    note: "80/20 BAL-WETH Balancer v2 pool token; the asset locked in veBAL"
    sources:
      - "docs: https://docs.balancer.fi/developer-reference/contracts/deployment-addresses/mainnet.html"
    proofs:
      - { from: veBAL, read: "token() returns (address)", expect: $self }
      - { read: "getVault() returns (address)", expect: balancer_v2.vault }
  veBAL:
    address: "0xC128a9954e6c874eA3d62ce62B468bA073093F25"
    name: "Vote Escrowed Balancer BPT"
    category: staking
    kind: voting_escrow
    decimals: 18
    aliases: ["vebal", "vote escrowed balancer bpt"]
    note: "B-80BAL-20WETH vote-escrow lock (non-transferable)"
    sources:
      - "docs: https://docs.balancer.fi/developer-reference/contracts/deployment-addresses/mainnet.html"
      - "address-book: https://github.com/balancer/balancer-deployments/blob/master/addresses/mainnet.json"
    edges: { underlying: B_80BAL_20WETH }
    proofs:
      - { from: gauge_controller, read: "voting_escrow() returns (address)", expect: $self }
      - { read: "token() returns (address)", expect: B_80BAL_20WETH }
