contracts:
  vault:
    address: "0xbA1333333333a1BA1108E8412f11850A5C319bA9"
    category: market
    kind: balancer_v3_vault
    aliases: ["balancer v3 vault", "balancer vault v3"]
    note: "Holds every v3 pool's tokens; users go through the routers, not the vault"
    sources:
      - "docs: https://docs.balancer.fi/developer-reference/contracts/deployment-addresses/mainnet.html"
      - "address-book: https://github.com/balancer/balancer-deployments/blob/master/addresses/mainnet.json"
      - "explorer: https://etherscan.io/address/0xbA1333333333a1BA1108E8412f11850A5C319bA9#code"
  router:
    address: "0xAE563E3f8219521950555F5962419C8919758Ea2"
    category: router
    kind: balancer_v3_router
    aliases: ["balancer v3 router"]
    note: "v3 Router (version 2): add/remove liquidity and swaps for a single pool; pulls tokens via Permit2"
    sources:
      - "docs: https://docs.balancer.fi/developer-reference/contracts/deployment-addresses/mainnet.html"
      - "address-book: https://github.com/balancer/balancer-deployments/blob/master/addresses/mainnet.json"
      - "explorer: https://etherscan.io/address/0xAE563E3f8219521950555F5962419C8919758Ea2#code"
    edges: { spender: permit2.Permit2 }
    proofs:
      - { read: "getPermit2() returns (address)", expect: permit2.Permit2 }
      - { read: "getWeth() returns (address)", expect: weth.WETH }
  composite_liquidity_router:
    address: "0xb21A277466e7dB6934556a1Ce12eb3F032815c8A"
    category: router
    kind: balancer_v3_composite_liquidity_router
    aliases: ["balancer v3 composite liquidity router"]
    note: "v3 CompositeLiquidityRouter (version 2): add/remove liquidity in underlying tokens for pools of ERC-4626 wrappers (waEthWETH, ...)"
    sources:
      - "docs: https://docs.balancer.fi/developer-reference/contracts/deployment-addresses/mainnet.html"
      - "address-book: https://github.com/balancer/balancer-deployments/blob/master/addresses/mainnet.json"
      - "explorer: https://etherscan.io/address/0xb21A277466e7dB6934556a1Ce12eb3F032815c8A#code"
    edges: { spender: permit2.Permit2 }
    proofs:
      - { read: "getPermit2() returns (address)", expect: permit2.Permit2 }
      - { read: "getWeth() returns (address)", expect: weth.WETH }
  Aave_GHO_USDT_USDC:
    address: "0x85B2b559bC2D21104C4DEFdd6EFcA8A20343361D"
    name: "Balancer Aave GHO/USDT/USDC"
    category: market
    kind: balancer_v3_pool
    decimals: 18
    aliases: ["Aave GHO/USDT/USDC", "balancer aave gho/usdt/usdc"]
    note: "Balancer v3 pool; the pool contract is also its BPT"
    sources:
      - "explorer: https://etherscan.io/address/0x85B2b559bC2D21104C4DEFdd6EFcA8A20343361D#code"
    proofs:
      - { read: "getVault() returns (address)", expect: vault }
