contracts:
  booster:
    address: "0xF403C135812408BFbE8713b5A23a04b3D48AAE31"
    category: staking
    kind: convex_booster
    aliases: ["convex booster"]
    note: "Entry point: deposit(pid, amount, stake) / withdraw(pid, amount); poolInfo(pid) lists each pool's contracts"
    sources:
      - "docs: https://docs.convexfinance.com/convexfinance/faq/contract-addresses"
      - "explorer: https://etherscan.io/address/0xF403C135812408BFbE8713b5A23a04b3D48AAE31#code"
    proofs:
      - { read: "crv() returns (address)", expect: curve.CRV }
  CVX:
    address: "0x4e3FBD56CD56c3e72c1403e103b45Db9da5B9D2B"
    name: "Convex Token"
    category: governance
    kind: erc20
    decimals: 18
    aliases: ["cvx", "convex token"]
    sources:
      - "docs: https://docs.convexfinance.com/convexfinance/faq/contract-addresses"
    proofs:
      - { from: booster, read: "minter() returns (address)", expect: $self }
  cvxCRV:
    address: "0x62B9c7356A2Dc64a1969e19C23e4f579F9810Aa7"
    name: "Convex CRV"
    category: token
    kind: erc20
    decimals: 18
    aliases: ["cvxcrv", "convex crv"]
    sources:
      - "docs: https://docs.convexfinance.com/convexfinance/faq/contract-addresses"
    edges: { underlying: curve.CRV }
    proofs:
      - { from: crv_depositor, read: "minter() returns (address)", expect: $self }
  crv_depositor:
    address: "0x8014595F2AB54cD7c604B00E9fb932176fDc86Ae"
    category: minter
    kind: convex_crv_depositor
    aliases: ["convex crv depositor"]
    note: "deposit(amount, lock, stakeAddress): CRV in, cvxCRV out (one way)"
    sources:
      - "docs: https://docs.convexfinance.com/convexfinance/faq/contract-addresses"
    proofs:
      - { from: cvxCRV, read: "operator() returns (address)", expect: $self }
      - { read: "crv() returns (address)", expect: curve.CRV }
  cvxCRV_rewards:
    address: "0x3Fe65692bfCD0e6CF84cB1E7d24108E434A7587e"
    category: staking
    kind: convex_base_reward_pool
    aliases: ["cvxcrv staking", "cvxcrv rewards"]
    note: "Legacy cvxCRV staking (BaseRewardPool); stkCvxCrv wraps it"
    sources:
      - "docs: https://docs.convexfinance.com/convexfinance/faq/contract-addresses"
    edges: { underlying: cvxCRV }
    proofs:
      - { from: booster, read: "lockRewards() returns (address)", expect: $self }
      - { read: "stakingToken() returns (address)", expect: cvxCRV }
  stkCvxCrv:
    address: "0xaa0C3f5F7DFD688C6E646F66CD2a6B66ACdbE434"
    name: "Staked CvxCrv"
    category: staking
    kind: convex_cvxcrv_staking_wrapper
    decimals: 18
    aliases: ["stkcvxcrv", "staked cvxcrv"]
    sources:
      - "docs: https://docs.convexfinance.com/convexfinance/faq/contract-addresses"
    edges: { underlying: cvxCRV }
    proofs:
      - { read: "cvxCrv() returns (address)", expect: cvxCRV }
      - { read: "cvxCrvStaking() returns (address)", expect: cvxCRV_rewards }
  cvx_rewards:
    address: "0xCF50b810E57Ac33B91dCF525C6ddd9881B139332"
    category: staking
    kind: convex_cvx_reward_pool
    aliases: ["cvx staking", "cvxrewardpool"]
    note: "CVX staking (cvxRewardPool), earns cvxCRV"
