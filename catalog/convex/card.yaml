protocol: convex
name: Convex (Curve LP boosting, cvxCRV, CVX)
chain_id: 1
status: reviewed
reviewed: true
adding: >
  A Convex pool is a deposit token and a BaseRewardPool from booster.poolInfo(pid).
  Add the deposit token keyed by its symbol() with operator() = booster as proof and
  an underlying edge to the Curve LP, and `<token key>_rewards` with operator() and
  stakingToken() as proofs. Put the pid in the note.
  Actions are per pool (the _rewards pools have no decimals, so no --token list):
  `<lp>_deposit` = Booster.deposit(pid, amount, _stake true) with the pid as a default,
  `<lp>_withdraw` = rewards.withdrawAndUnwrap(amount, claim true), `<lp>_claim`. The
  pid is a free param in the role (one Booster selector, several pids cannot merge).
sources:
  - "docs: https://docs.convexfinance.com"
  - "explorer: verified source (Booster, BaseRewardPool, CvxRewardPool, CrvDepositor, cvxCRV staking)"

contracts: {}

actions:
  3Crv_deposit:
    summary: "curve.3Crv -> Convex pid 9, staked in cvx3Crv_rewards (earns CRV + CVX)"
    input: curve.3Crv
    defaults: { pid: 9 }
    calls:
      - target: curve.3Crv
        sig: "approve(address spender, uint256 amount)"
        args: { spender: booster, amount: $amount }
      - target: booster
        sig: "deposit(uint256 _pid, uint256 _amount, bool _stake)"
        args: { _pid: $pid, _amount: $amount, _stake: true }
    note: "pid 9 is filled in; cvx3Crv is minted and staked for msg.sender (the Vault)"
  3Crv_withdraw:
    summary: "cvx3Crv_rewards -> curve.3Crv back to the Vault (unstake + unwrap, claims rewards)"
    input: cvx3Crv
    calls:
      - target: cvx3Crv_rewards
        sig: "withdrawAndUnwrap(uint256 amount, bool claim)"
        args: { amount: $amount, claim: true }
  3Crv_claim:
    summary: "CRV, CVX and extra rewards of cvx3Crv_rewards -> the Vault"
    calls:
      - target: cvx3Crv_rewards
        sig: "getReward(address _account, bool _claimExtras)"
        args: { _account: $AVATAR, _claimExtras: true }
