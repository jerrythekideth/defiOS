    summary: "CVX -> cvx_rewards (single staking, earns cvxCRV)"
    input: CVX
    calls:
      - target: CVX
        sig: "approve(address spender, uint256 amount)"
        args: { spender: cvx_rewards, amount: $amount }
      - target: cvx_rewards
        sig: "stake(uint256 _amount)"
        args: { _amount: $amount }
  cvx_unstake:
    summary: "cvx_rewards -> CVX back to the Vault (claims rewards)"
    input: CVX
    calls:
      - target: cvx_rewards
        sig: "withdraw(uint256 _amount, bool claim)"
        args: { _amount: $amount, claim: true }
  cvx_claim:
    summary: "cvxCRV rewards of cvx_rewards -> the Vault"
    calls:
      - target: cvx_rewards
        sig: "getReward(bool _stake)"
        args: { _stake: false }
  crv_to_cvxcrv:
    summary: "CRV -> cvxCRV through crv_depositor (one way: there is no redeem, exit is a market sale)"
    input: curve.CRV
    calls:
      - target: curve.CRV
        sig: "approve(address spender, uint256 amount)"
        args: { spender: crv_depositor, amount: $amount }
      - target: crv_depositor
        sig: "deposit(uint256 _amount, bool _lock)"
        args: { _amount: $amount, _lock: true }
    note: "cvxCRV is minted to msg.sender (the Vault). _lock true locks the CRV now and skips the caller incentive fee"
  cvxcrv_stake:
    summary: "cvxCRV -> stkCvxCrv (staked cvxCRV, earns CRV / 3CRV / CVX)"
    input: cvxCRV
    calls:
      - target: cvxCRV
        sig: "approve(address spender, uint256 amount)"
        args: { spender: stkCvxCrv, amount: $amount }
      - target: stkCvxCrv
        sig: "stake(uint256 _amount, address _to)"
        args: { _amount: $amount, _to: $AVATAR }
  cvxcrv_unstake:
    summary: "stkCvxCrv -> cvxCRV back to the Vault"
    input: stkCvxCrv
