contracts:
  booster:
    address: "0xA57b8d98dAE62B26Ec3bcC4a365338157060B234"
    category: staking
    kind: aura_booster
    aliases: ["aura booster"]
    note: "Aura is winding down on mainnet: the Booster is shut down (isShutdown() = true) and pools are withdrawal-only. withdraw(pid, amount) still works; deposits revert"
    sources:
      - "address-book: https://github.com/aurafinance/aura-contracts/blob/main/tasks/deploy/mainnet-config.ts"
      - "explorer: https://etherscan.io/address/0xA57b8d98dAE62B26Ec3bcC4a365338157060B234#code"
    proofs:
      - { read: "crv() returns (address)", expect: balancer.BAL }
      - { read: "minter() returns (address)", expect: AURA }
  AURA:
    address: "0xC0c293ce456fF0ED870ADd98a0828Dd4d2903DBF"
    name: "Aura"
    category: governance
    kind: erc20
    decimals: 18
    aliases: ["aura"]
    sources:
      - "address-book: https://github.com/aurafinance/aura-contracts/blob/main/tasks/deploy/mainnet-config.ts"
    proofs:
      - { from: booster, read: "minter() returns (address)", expect: $self }
  auraBAL:
    address: "0x616e8BfA43F920657B3497DBf40D6b1A02D4608d"
    name: "Aura BAL"
    category: token
    kind: erc20
    decimals: 18
    aliases: ["aurabal", "aura bal"]
    sources:
      - "address-book: https://github.com/aurafinance/aura-contracts/blob/main/tasks/deploy/mainnet-config.ts"
    edges: { underlying: balancer.B_80BAL_20WETH }
    proofs:
      - { from: bal_depositor, read: "minter() returns (address)", expect: $self }
  bal_depositor:
    address: "0xeAd792B55340Aa20181A80d6a16db6A0ECd1b827"
    category: minter
    kind: aura_crv_depositor
    aliases: ["aura bal depositor", "aurabal depositor"]
    note: "B-80BAL-20WETH in, auraBAL out (one way)"
    sources:
      - "address-book: https://github.com/aurafinance/aura-contracts/blob/main/tasks/deploy/mainnet-config.ts"
    proofs:
      - { from: auraBAL, read: "operator() returns (address)", expect: $self }
      - { read: "crvBpt() returns (address)", expect: balancer.B_80BAL_20WETH }
  auraBAL_rewards:
    address: "0x00A7BA8Ae7bca0B10A32Ea1f8e2a1Da980c6CAd2"
    category: staking
    kind: aura_base_reward_pool
    aliases: ["aurabal staking", "aurabal rewards"]
    note: "auraBAL staking (BaseRewardPool); stkauraBAL compounds on top of it"
    sources:
      - "address-book: https://github.com/aurafinance/aura-contracts/blob/main/tasks/deploy/mainnet-config.ts"
    edges: { underlying: auraBAL }
    proofs:
      - { from: booster, read: "lockRewards() returns (address)", expect: $self }
      - { read: "stakingToken() returns (address)", expect: auraBAL }
  stkauraBAL:
    address: "0xfAA2eD111B4F580fCb85C48E6DC6782Dc5FCD7a6"
    name: "Staked Aura BAL"
    category: vault
    kind: erc4626
    decimals: 18
    aliases: ["staked aura bal"]
    sources:
      - "address-book: https://github.com/aurafinance/aura-contracts/blob/main/tasks/deploy/mainnet-config.ts"
    edges: { underlying: auraBAL }
    proofs:
      - { read: "asset() returns (address)", expect: auraBAL }
  vlAURA:
    address: "0x3Fa73f1E5d8A792C80F426fc8F84FBF7Ce9bBCAC"
    name: "Vote Locked Aura"
    category: staking
    kind: aura_locker
    decimals: 18
    aliases: ["vlaura", "vote locked aura", "auralocker"]
    note: "AURA vote lock (16 weeks); processExpiredLocks(relock) to exit"
    sources:
      - "address-book: https://github.com/aurafinance/aura-contracts/blob/main/tasks/deploy/mainnet-config.ts"
    edges: { underlying: AURA }
    proofs:
      - { read: "stakingToken() returns (address)", expect: AURA }
      - { read: "cvxCrv() returns (address)", expect: auraBAL }
  auraAave_GHO_USDT_USDC:
