protocol: curve
name: Curve (pools, gauges, CRV, veCRV)
chain_id: 1
status: reviewed
reviewed: true
adding: >
  Curve pools are found through the MetaRegistry (address_provider.get_address(7)).
  A new pool is keyed by its LP symbol() (characters other than letters, digits and _
  become _, the symbol goes in `aliases`), with get_lp_token(pool) from meta_registry
  as proof. Old pools whose LP is a separate token get two records (pool + LP).
  A gauge is `<lp key>_gauge` with lp_token() and meta_registry get_gauge(pool) as proofs.
  Actions are per pool: `<lp key>_add_<COIN>` (single-sided add_liquidity with the
  coin's slot set, the other slots 0), `_remove_one`, `_remove`, `_stake`; unstake /
  claims take a gauge with --token. Use the receiver-less overloads: the engine models
  fixed-size arrays (uint256[N]) as dynamic, so params after one cannot be pinned.
  A coin without a card record gets no add action until it has one.
sources:
  - "docs: https://docs.curve.fi"
  - "explorer: verified source (each pool, gauge and the Minter; signatures copied from the verified ABI)"

contracts: {}

actions:
  steth_pool_add_ETH:
    summary: "ETH -> steCRV (single-sided add to steth_pool), minted to the Vault"
    input: ETH
    defaults: { none: 0 }
    calls:
      - target: steth_pool
        sig: "add_liquidity(uint256[2] amounts, uint256 min_mint_amount)"
        args: { amounts: [$amount, $none], min_mint_amount: $min_lp }
        send: true
    note: "min_lp (raw, 18 decimals) = calc_token_amount minus your slippage; coins: 0 = ETH, 1 = stETH; LP is minted to msg.sender (the Vault)"
  steth_pool_add_stETH:
    summary: "stETH -> steCRV (single-sided add to steth_pool), minted to the Vault"
    input: lido.stETH
    defaults: { none: 0 }
    calls:
      - target: lido.stETH
        sig: "approve(address spender, uint256 amount)"
        args: { spender: steth_pool, amount: $amount }
      - target: steth_pool
        sig: "add_liquidity(uint256[2] amounts, uint256 min_mint_amount)"
        args: { amounts: [$none, $amount], min_mint_amount: $min_lp }
    note: "min_lp (raw, 18 decimals) = calc_token_amount minus your slippage; coins: 0 = ETH, 1 = stETH; LP is minted to msg.sender (the Vault)"
  steth_pool_remove_one:
    summary: "steCRV -> one coin of steth_pool (pick it with i), paid to the Vault"
    input: steCRV
    calls:
      - target: steth_pool
        sig: "remove_liquidity_one_coin(uint256 _token_amount, int128 i, uint256 _min_amount)"
        args: { _token_amount: $amount, i: $i, _min_amount: $min_out }
    note: "--param i=<coin index> min_out=<raw units of that coin>; coins: 0 = ETH, 1 = stETH; i of ETH pays native ETH"
  steth_pool_remove:
    summary: "steCRV -> every coin of steth_pool in pool proportions, paid to the Vault"
    input: steCRV
    calls:
      - target: steth_pool
        sig: "remove_liquidity(uint256 _amount, uint256[2] _min_amounts)"
        args: { _amount: $amount, _min_amounts: [$min0, $min1] }
    note: "--param min0=.. min1=.. (raw minimum per coin); coins: 0 = ETH, 1 = stETH"
  steth_pool_stake:
    summary: "steCRV -> steCRV_gauge (stake the LP in its gauge to earn CRV)"
    input: steCRV
    calls:
      - target: steCRV
        sig: "approve(address spender, uint256 amount)"
        args: { spender: steCRV_gauge, amount: $amount }
      - target: steCRV_gauge
        sig: "deposit(uint256 _value)"
        args: { _value: $amount }
