contracts:
  address_provider:
    address: "0x5ffe7FB82894076ECB99A30D6A32e969e6e35E98"
    category: config
    kind: curve_address_provider
    aliases: ["curve address provider", "addressprovider"]
    note: "Curve's address index: get_address(id) returns the current contract for each id (7 = MetaRegistry)"
    sources:
      - "docs: https://docs.curve.finance/user/deployments"
      - "explorer: https://etherscan.io/address/0x5ffe7FB82894076ECB99A30D6A32e969e6e35E98#code"
  meta_registry:
    address: "0xF98B45FA17DE75FB1aD0e7aFD971b0ca00e379fC"
    category: config
    kind: curve_meta_registry
    aliases: ["curve metaregistry", "metaregistry"]
    note: "Pool index across all Curve factories: get_lp_token / get_gauge / get_pool_from_lp_token"
    sources:
      - "docs: https://docs.curve.finance/user/deployments"
    proofs:
      - { from: address_provider, read: "get_address(uint256 id) returns (address)", args: [7], expect: $self }
  CRV:
    address: "0xD533a949740bb3306d119CC777fa900bA034cd52"
    name: "Curve DAO Token"
    category: governance
    kind: erc20
    decimals: 18
    aliases: ["crv", "curve dao token"]
    sources:
      - "docs: https://docs.curve.finance/user/deployments"
    proofs:
      - { from: address_provider, read: "get_address(uint256 id) returns (address)", args: [19], expect: $self }
      - { from: minter, read: "token() returns (address)", expect: $self }
  minter:
    address: "0xd061D61a4d941c39E5453435B6345Dc261C2fcE0"
    category: minter
    kind: curve_minter
    aliases: ["curve minter", "crv minter"]
    note: "mint(gauge) claims CRV emissions for a gauge deposit"
    sources:
      - "docs: https://docs.curve.finance/user/deployments"
    edges: { reads_from: gauge_controller }
    proofs:
      - { from: steCRV_gauge, read: "minter() returns (address)", expect: $self }
      - { read: "controller() returns (address)", expect: gauge_controller }
  gauge_controller:
    address: "0x2F50D538606Fa9EDD2B11E2446BEb18C9D5846bB"
    category: config
    kind: curve_gauge_controller
    aliases: ["curve gauge controller"]
    sources:
      - "docs: https://docs.curve.finance/user/deployments"
    proofs:
      - { from: minter, read: "controller() returns (address)", expect: $self }
      - { read: "voting_escrow() returns (address)", expect: veCRV }
      - { read: "token() returns (address)", expect: CRV }
  veCRV:
    address: "0x5f3b5DfEb7B28CDbD7FAba78963EE202a494e2A2"
