    decimals: 18
    aliases: ["vecrv", "vote-escrowed crv"]
    note: "CRV vote-escrow lock (non-transferable)"
    sources:
      - "docs: https://docs.curve.finance/user/deployments"
    edges: { underlying: CRV }
    proofs:
