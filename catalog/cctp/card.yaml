dead_permissions:
  - target: token_messenger
    selector: "0x11cffb67"
    why: "handleReceiveFinalizedMessage is called by the MessageTransmitter only"
  - target: token_messenger
    selector: "0xb2118a8d"
    why: "rescueERC20 is Circle's rescuer role only"
