protocol: tokens
name: ERC-20 tokens with no card of their own
chain_id: 1
status: reviewed
reviewed: true
sources:
  - "address-book: https://github.com/bgd-labs/aave-address-book/blob/main/src/AaveV3Ethereum.sol"
  - "token pages on Etherscan / Blockscout (verified source)"
adding: |
  Plain tokens that lending markets, pools and vaults take but whose issuer has
  no card here. Key = onchain symbol(), `name` = onchain name(), `decimals` =
  onchain decimals(). Prove each one with a market that lists it, e.g.
  `{ from: aave_v3.pool, read: "getReservesList() returns (address[])", expect: { contains: $self } }`.
  When the issuer gets a card (staking, minting actions), move the record there
  and leave `{ ref: <card>.<symbol> }` here so existing references keep working.

