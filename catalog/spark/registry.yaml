contracts:
  SPK:
    address: "0xc20059e0317DE91738d13af027DfC4a50781b066"
    name: "Spark"
    category: governance
    kind: erc20
    decimals: 18
    sources:
      - "address-book: https://github.com/sparkdotfi/spark-address-registry/blob/master/src/Ethereum.sol"
  spark_proxy:
    address: "0x3300f198988e4C9C63F75dF86De36421f06af8c4"
    category: timelock
    kind: sub_proxy
    aliases: ["SPARK_PROXY"]
    note: "Executes Spark governance spells; ACL admin of SparkLend"
    sources:
      - "address-book: https://github.com/sparkdotfi/spark-address-registry/blob/master/src/Ethereum.sol"
    proofs:
      - { from: addresses_provider, read: "getACLAdmin() returns (address)", expect: $self }
  provider_registry:
    address: "0x03cFa0C4622FF84E50E75062683F44c9587e6Cc1"
    category: config
    kind: addresses_provider_registry
    sources:
      - "address-book: https://github.com/sparkdotfi/spark-address-registry/blob/master/src/Ethereum.sol"
    proofs:
      - { read: "getAddressesProvidersList() returns (address[])", expect: { contains: addresses_provider } }
  addresses_provider:
    address: "0x02C3eA4e34C0cBd694D2adFa2c690EECbC1793eE"
    category: config
    kind: addresses_provider
    sources:
      - "address-book: https://github.com/sparkdotfi/spark-address-registry/blob/master/src/Ethereum.sol"
    proofs:
      - { from: provider_registry, read: "getAddressesProvidersList() returns (address[])", expect: { contains: $self } }
  pool:
    address: "0xC13e21B648A5Ee794902342038FF3aDAB66BE987"
    category: market
    kind: aave_v3_pool
    aliases: ["sparklend pool", "spark pool"]
    sources:
      - "address-book: https://github.com/sparkdotfi/spark-address-registry/blob/master/src/Ethereum.sol"
    edges: { reads_from: addresses_provider }
    proofs:
      - { from: addresses_provider, read: "getPool() returns (address)", expect: $self }
  pool_configurator:
    address: "0x542DBa469bdE58FAeE189ffB60C6b49CE60E0738"
    category: config
    kind: pool_configurator
    sources:
      - "address-book: https://github.com/sparkdotfi/spark-address-registry/blob/master/src/Ethereum.sol"
    proofs:
      - { from: addresses_provider, read: "getPoolConfigurator() returns (address)", expect: $self }
  oracle:
    address: "0x8105f69D9C41644c6A0803fDA7D03Aa70996cFD9"
    category: oracle
    kind: aave_oracle
    sources:
      - "address-book: https://github.com/sparkdotfi/spark-address-registry/blob/master/src/Ethereum.sol"
    proofs:
      - { from: addresses_provider, read: "getPriceOracle() returns (address)", expect: $self }
  acl_manager:
    address: "0xdA135Cd78A086025BcdC87B038a1C462032b510C"
    category: config
    kind: acl_manager
    sources:
      - "address-book: https://github.com/sparkdotfi/spark-address-registry/blob/master/src/Ethereum.sol"
    edges: { admin: spark_proxy }
    proofs:
      - { from: addresses_provider, read: "getACLManager() returns (address)", expect: $self }
  data_provider:
    address: "0xFc21d6d146E6086B8359705C8b28512a983db0cb"
    category: config
    kind: pool_data_provider
    sources:
      - "address-book: https://github.com/sparkdotfi/spark-address-registry/blob/master/src/Ethereum.sol"
    proofs:
      - { from: addresses_provider, read: "getPoolDataProvider() returns (address)", expect: $self }
  weth_gateway:
    address: "0xBD7D6a9ad7865463DE44B05F04559f65e3B11704"
    category: adapter
    kind: weth_gateway
    aliases: ["spark weth gateway"]
    sources:
      - "address-book: https://github.com/sparkdotfi/spark-address-registry/blob/master/src/Ethereum.sol"
      - "explorer: https://etherscan.io/address/0xBD7D6a9ad7865463DE44B05F04559f65e3B11704#code"
    edges: { underlying: weth.WETH }
  incentives_controller:
    address: "0x4370D3b6C9588E02ce9D22e684387859c7Ff5b34"
    category: config
    kind: rewards_controller
    sources:
      - "address-book: https://github.com/sparkdotfi/spark-address-registry/blob/master/src/Ethereum.sol"
    proofs:
      - { from: spDAI, read: "getIncentivesController() returns (address)", expect: $self }
  treasury:
    address: "0x856900aa78e856a5df1a2665eE3a66b2487cD68f"
    category: escrow
    kind: treasury
    aliases: ["spark collector"]
    sources:
